name: Update RSS Feed

on:
  schedule:
    - cron: '0 * * * *' # S'exécute toutes les heures
  workflow_dispatch: # Permet le lancement manuel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Autorise le bot à publier le fichier XML

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Generate RSS
        run: python -u generate_rss.py

      - name: Commit and Push XML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml history.json
          
          # Si rien n'a changé, on s'arrête proprement (exit 0)
          git diff --staged --quiet && echo "Aucun changement détecté" && exit 0
          
          # Sinon, on commit
          git commit -m "Auto-update RSS feed and history"
          
          # On tente de pousser avec un mécanisme de secours en cas d'erreur réseau/serveur (jusqu'à 3 essais)
          for i in {1..3}; do
            git push && break || {
              echo "Tentative $i échouée, nouvelle tentative dans 5 secondes..."
              sleep 5
              git pull --rebase
            }
          done
