name: Update RSS Feed

on:
  schedule:
    - cron: '0 * * * *' # S'exécute toutes les heures
  workflow_dispatch: # Permet le lancement manuel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Autorise le bot à publier le fichier XML

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Generate RSS
        run: python generate_rss.py

      - name: Commit and Push XML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml history.json
          # Si rien n'a changé, on s'arrête proprement (exit 0)
          git diff --staged --quiet && echo "Aucun changement détecté" && exit 0
          # Sinon, on commit et on pousse
          git commit -m "Auto-update RSS feed and history"
          git push
